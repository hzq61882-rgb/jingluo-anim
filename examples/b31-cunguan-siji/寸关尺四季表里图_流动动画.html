$('h1').textContent=CFG.title;$('subt').textContent=CFG.sub;$('note').innerHTML=CFG.note;document.title=CFG.title;
const COL={gold:'#ffd34d',solid:'#22e0ff',dashed:'#ff4fa3',faint:'#c08cff'};
function poly(p){return 'M'+p.map(q=>q[0]+','+q[1]).join('L');}
const LAY={};
CFG.layers.forEach(l=>{LAY[l.id]=el('g',{id:'L_'+l.id},$('layers'));
  const lab=document.createElement('label');lab.innerHTML=`<input type="checkbox" checked> ${l.label}`;
  lab.querySelector('input').onchange=e=>{LAY[l.id].style.display=e.target.checked?'':'none';};$('toggles').appendChild(lab);});
function kfor(v0,P){return Math.max(1,Math.round(v0*CYC/P));}
// ---------- build items ----------
const ITEMS={};const items=CFG.items.map(it=>{
  const g=el('g',{},LAY[it.layer]);const o={it,g};ITEMS[it.id]=o;
  if(it.type==='pulse'){
    o.halo=el('circle',{cx:it.c[0],cy:it.c[1],r:it.r+4,fill:'none',stroke:it.color||'#ffe27a','stroke-width':4,opacity:0,filter:'url(#glowBig)'},g);
    o.ring=el('circle',{cx:it.c[0],cy:it.c[1],r:it.r,fill:'none',stroke:it.color||'#ffe27a','stroke-width':2.4,opacity:0,filter:'url(#glow)'},g);
    o.wave=el('circle',{cx:it.c[0],cy:it.c[1],r:it.r,fill:'none',stroke:it.color||'#ffe27a','stroke-width':1.6,opacity:0},g);
    return o;}
  const d=it.closed?poly(it.pts)+'Z':poly(it.pts);const st=it.style;const w=it.width||3;
  if(st==='band'){
    o.trail=el('path',{d,fill:'none',stroke:'#ffe27a','stroke-width':w*0.75,'stroke-linecap':'round','stroke-opacity':0,filter:'url(#glow)'},g);
    o.dash=el('path',{d,fill:'none',stroke:it.color||'#fff','stroke-width':Math.max(2,w*0.42),'stroke-linecap':'round','stroke-dasharray':`2 ${it.gap||13}`,'stroke-opacity':0.9},g);
    o.P=2+(it.gap||13);o.k=kfor(it.v||22,o.P);
  } else if(st==='gold'||st==='faint'){
    const c=it.color||COL[st];
    o.under=el('path',{d,fill:'none',stroke:c,'stroke-width':w+3,'stroke-opacity':st==='gold'?0.18:0.08,'stroke-linecap':'round'},g);
    o.dash=el('path',{d,fill:'none',stroke:c,'stroke-width':w,'stroke-linecap':'round','stroke-dasharray':st==='gold'?'10 12':'3 8','stroke-opacity':st==='gold'?0.9:0.7,filter:st==='gold'?'url(#glow)':null},g);
    o.P=st==='gold'?22:11;o.k=kfor(it.v||(st==='gold'?24:14),o.P);
    o.trail=el('path',{d,fill:'none',stroke:'#fff3b0','stroke-width':w+1.5,'stroke-linecap':'round','stroke-opacity':0,filter:'url(#glow)'},g);
  } else if(st==='solid'){
    o.under=el('path',{d,fill:'none',stroke:COL.solid,'stroke-width':w+4,'stroke-opacity':0.16,'stroke-linecap':'round'},g);
    o.dash=el('path',{d,fill:'none',stroke:COL.solid,'stroke-width':w,'stroke-linecap':'round','stroke-dasharray':'12 10','stroke-opacity':0.95,filter:'url(#glow)'},g);
    o.P=22;o.k=kfor(it.v||30,o.P);
  } else if(st==='dashed'){
    o.under=el('path',{d,fill:'none',stroke:COL.dashed,'stroke-width':w+3,'stroke-opacity':0.14,'stroke-linecap':'round','stroke-dasharray':'4 5'},g);
    o.dash=el('path',{d,fill:'none',stroke:'none'},g);
    o.P=1;o.k=0;o.chev=[];
  }
  o.len=o.dash.getTotalLength();
  g.querySelectorAll('path').forEach(pp=>{if(pp.getAttribute('filter')==='url(#glow)'){const bb=pp.getBBox();if(bb.width<3||bb.height<3)pp.setAttribute('filter','url(#glowU)');}});
  if(st==='dashed'){const n=Math.max(2,Math.round(o.len/(it.spacing||34)));o.k=kfor((it.v||30)/o.len*n,1);
    for(let i=0;i<n;i++)o.chev.push(el('path',{d:'M-5,-4.5L3,0L-5,4.5',fill:'none',stroke:COL.dashed,'stroke-width':2.6,'stroke-linecap':'round','stroke-linejoin':'round',filter:'url(#glow)'},g));o.n=n;}
  if(st==='solid'||st==='gold'){o.dots=[];const n=it.dots??Math.max(1,Math.round(o.len/160));o.n=n;
    o.dk=kfor((it.v||30)/o.len,1);
    for(let i=0;i<n;i++)o.dots.push(el('circle',{r:st==='solid'?3.2:3.6,fill:st==='solid'?'#e8fdff':'#fff6c8',filter:'url(#glow)'},g));}
  if(it.comet){o.spark=el('circle',{r:9,fill:'url(#spark)',opacity:0},g);o.core=el('circle',{r:2.6,fill:'#fffdf2',opacity:0},g);}
  return o;});
// ---------- caption ----------
const cap=$('caption');const cy=H;
el('rect',{x:0,y:cy,width:W,height:CAP*S,fill:'#4a2366'},cap);el('rect',{x:0,y:cy,width:W,height:2*S,fill:'#D4AF37'},cap);
const cg=el('g',{transform:`translate(0,${cy}) scale(${S})`},cap);
const capMain=el('text',{x:16,y:30,'font-size':21,fill:'#D4AF37','font-weight':'bold','letter-spacing':1},cg);
const capSub=el('text',{x:16,y:52,'font-size':12.5,fill:'#f3ead6'},cg);
// step dots
const nst=CFG.steps.length;const dotsG=el('g',{},cg);const stepDots=CFG.steps.map((s,i)=>el('circle',{cx:W/S-16-(nst-1-i)*13,cy:24,r:4,fill:'#cbb6dc',opacity:0.5},dotsG));
// legend
let lx=16;const lg=el('g',{transform:'translate(0,74)'},cg);
CFG.legend.forEach(L=>{const g=el('g',{transform:`translate(${lx},0)`},lg);
  if(L.kind==='band'){el('rect',{x:0,y:-5,width:22,height:10,rx:5,fill:L.color||'#e0392b'},g);el('path',{d:'M2,0L20,0',stroke:'#fff','stroke-width':2.5,'stroke-dasharray':'2 5'},g);}
  else if(L.kind==='gold'){el('path',{d:'M0,0L22,0',stroke:COL.gold,'stroke-width':2.6,'stroke-dasharray':'7 4',filter:'url(#glowU)'},g);}
  else if(L.kind==='solid'){el('path',{d:'M0,0L22,0',stroke:COL.solid,'stroke-width':2.6,filter:'url(#glowU)'},g);el('circle',{cx:15,cy:0,r:2.6,fill:'#e8fdff'},g);}
  else if(L.kind==='dashed'){el('path',{d:'M0,0L22,0',stroke:COL.dashed,'stroke-width':2,'stroke-dasharray':'3 3','stroke-opacity':0.6},g);el('path',{d:'M8,-4L14,0L8,4',fill:'none',stroke:COL.dashed,'stroke-width':2.4},g);}
  else if(L.kind==='faint'){el('path',{d:'M0,0L22,0',stroke:COL.faint,'stroke-width':1.8,'stroke-dasharray':'3 4'},g);}
  else if(L.kind==='pulse'){el('circle',{cx:11,cy:0,r:5.5,fill:'none',stroke:L.color||'#ffe27a','stroke-width':2},g);}
  const t=el('text',{x:27,y:4,'font-size':11,fill:'#f3ead6'},g);t.textContent=L.label;
  lx+=27+t.getComputedTextLength()+14;});
const cr=el('text',{x:16,y:98,'font-size':10,fill:'#cbb6dc'},cg);cr.textContent=CFG.credit;
// ---------- timeline ----------
const starts=[];{let a=0;CFG.steps.forEach(s=>{starts.push(a);a+=s.dur;});}
function ease(x){return x<0?0:x>1?1:x*x*(3-2*x);}
function pt(o,f){return o.dash.getPointAtLength(Math.max(0,Math.min(1,f))*o.len);}
function render(tm,tb){
  const t=((tm%CYC)+CYC)%CYC;const ph=t/CYC;const phb=(((tb%CYC)+CYC)%CYC)/CYC;
  let si=0;for(let i=0;i<nst;i++)if(t>=starts[i])si=i;
  const st=CFG.steps[si],lt=(t-starts[si])/st.dur;const on=new Set(st.on||[]);
  const prev=new Set((CFG.steps[(si-1+nst)%nst].on)||[]);
  capMain.textContent=st.main;capSub.textContent=st.sub||'';
  stepDots.forEach((d,i)=>{d.setAttribute('fill',i===si?'#ffe27a':'#cbb6dc');d.setAttribute('opacity',i===si?1:0.45);d.setAttribute('r',i===si?5:4);});
  items.forEach(o=>{const it=o.it;const P=it.group==='black'?phb:ph;const act=on.has(it.id);
    if(it.type==='pulse'){
      if(act){const pul=0.6+0.4*Math.sin(lt*Math.PI*6);o.ring.setAttribute('opacity',pul.toFixed(3));o.halo.setAttribute('opacity',(0.6*pul).toFixed(3));
        const w=(lt*3)%1;o.wave.setAttribute('r',(it.r+w*16).toFixed(2));o.wave.setAttribute('opacity',(1-w).toFixed(3));}
      else{const b=it.idle??0;o.ring.setAttribute('opacity',b);o.halo.setAttribute('opacity',0);o.wave.setAttribute('opacity',0);}
      return;}
    if(o.k&&o.P>1)o.dash.setAttribute('stroke-dashoffset',(-o.k*o.P*P).toFixed(2));
    if(o.dots)o.dots.forEach((d,i)=>{let f=(o.dk*P+i/o.n)%1;if(it.closed===undefined&&false)f=f;const q=pt(o,f);d.setAttribute('cx',q.x.toFixed(1));d.setAttribute('cy',q.y.toFixed(1));d.setAttribute('opacity',it.closed?1:Math.min(1,Math.sin(Math.PI*f)*2).toFixed(3));});
    if(o.chev)o.chev.forEach((c,i)=>{const f=(o.k*P+i/o.n)%1;const a=pt(o,f),b=pt(o,Math.min(1,f+1.5/o.len)),a0=pt(o,Math.max(0,f-1.5/o.len));
      const ang=Math.atan2(b.y-a0.y,b.x-a0.x)*180/Math.PI;c.setAttribute('transform',`translate(${a.x.toFixed(1)},${a.y.toFixed(1)}) rotate(${ang.toFixed(1)})`);c.setAttribute('opacity',Math.min(1,Math.sin(Math.PI*f)*2.5).toFixed(3));});
    // highlight for active step
    if(o.trail){
      if(act){const cs=it.cs??0,ce=it.ce??0.85;const p=it.closed?lt:ease((lt-cs)/(ce-cs));o.trail.setAttribute('stroke-dasharray',`${(p*o.len).toFixed(1)} ${o.len*2+10}`);o.trail.setAttribute('stroke-opacity',it.style==='band'?0.85:0.9);
        if(o.spark){const q=pt(o,p);[o.spark,o.core].forEach(s=>{s.setAttribute('cx',q.x);s.setAttribute('cy',q.y);s.setAttribute('opacity',lt>=cs?1:0);});}}
      else if(prev.has(it.id)){const fd=Math.max(0,1-lt*2.5);o.trail.setAttribute('stroke-dasharray',`${o.len+1} 0`);o.trail.setAttribute('stroke-opacity',(0.6*fd).toFixed(3));if(o.spark){o.spark.setAttribute('opacity',0);o.core.setAttribute('opacity',0);}}
      else{o.trail.setAttribute('stroke-opacity',0);if(o.spark){o.spark.setAttribute('opacity',0);o.core.setAttribute('opacity',0);}}
      if(it.style==='band')o.dash.setAttribute('stroke-opacity',act?1:(it.idleOp??0.75));
      if(it.style==='faint')o.dash.setAttribute('stroke-opacity',act?1:0.6);
      if(it.style==='gold'&&it.idleOp!==undefined)o.dash.setAttribute('stroke-opacity',act?0.95:it.idleOp);
    }
  });
}
window.renderAt=t=>render(t,t);window.CYC=CYC;
// ---------- controls ----------
let Tm=0,Tb=0,playing=true,sm=1,sb=1,last=null;
const video=/[?&]video=1/.test(location.search);
if(video)document.body.classList.add('video');
function loop(ts){if(last!==null&&playing){const dt=(ts-last)/1000;Tm+=dt*sm;Tb+=dt*sb;}last=ts;render(Tm,Tb);$('scrub').value=((Tm%CYC+CYC)%CYC/CYC).toFixed(3);requestAnimationFrame(loop);}
if(!video)requestAnimationFrame(loop);else render(0,0);
$('btnPlay').onclick=()=>{playing=!playing;$('btnPlay').textContent=playing?'⏸ 暂停':'▶ 播放';};
$('spMain').oninput=e=>{sm=+e.target.value;$('spMainV').textContent=sm.toFixed(1)+'×';};
$('spBlack').oninput=e=>{sb=+e.target.value;$('spBlackV').textContent=sb.toFixed(1)+'×';};
$('scrub').oninput=e=>{const nt=+e.target.value*CYC;const d=nt-((Tm%CYC+CYC)%CYC);Tm+=d;Tb+=d;render(Tm,Tb);};
</script>
