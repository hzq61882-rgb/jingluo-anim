html,body{margin:0;background:#2a1338;color:#f3ead6;font-family:'NotoTC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif}
svg text{font-family:'NotoTC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
h1{font-size:20px;color:#D4AF37;margin:6px 0 4px}
.sub{font-size:13px;color:#cbb6dc;margin-bottom:8px}
.view{overflow:auto;max-height:82vh;background:#efe6d6;border:1px solid rgba(212,175,55,.45);border-radius:6px}
#stage{width:100%;min-width:920px;height:auto;display:block;background:#fbf8f2}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:10px 0;font-size:15px}
button{font-family:inherit;background:#6B3A8C;color:#f3ead6;border:1px solid #D4AF37;border-radius:4px;padding:6px 12px;font-size:15px;cursor:pointer;min-height:40px}
label{cursor:pointer}
input[type=range]{accent-color:#D4AF37;width:min(100%,200px)}
.note{font-size:13px;line-height:1.7;color:#cbb6dc}
body.video .wrap{max-width:none;padding:0}
body.video h1,body.video .sub,body.video .ctl,body.video .note{display:none}
body.video .view{max-height:none;border:0;overflow:visible}
body.video #stage{min-width:0;width:100vw}
body.quiet .fx-crowd{display:none}
body.hc{background:#120814;color:#fff}
body.hc .note,body.hc .sub{color:#f6efe2}

.corr{margin-top:14px;background:#3a2150;border:1px solid rgba(212,175,55,.45);border-radius:6px;padding:12px 14px;color:#f6efe2}
.corr h2{font-size:16px;color:#D4AF37;margin:14px 0 6px}
.corr p,.corr li{font-size:14px;line-height:1.65;margin:6px 0}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.zone{background:#2a1338;border:1px solid rgba(212,175,55,.35);border-radius:4px;padding:8px 10px}
.zone h3{margin:0 0 4px;font-size:15px;color:#ffd9a0}
.ok{color:#d8ffd0}
.wait{color:#ffe0a8}
table.shu{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.shu td,table.shu th{border:1px solid rgba(212,175,55,.3);padding:4px 6px;text-align:left;vertical-align:top}
#stage{min-width:0}
details.extra{margin-top:12px;background:#2a1338;border:1px solid rgba(212,175,55,.35);border-radius:4px;padding:8px 10px}
details.extra summary{cursor:pointer;color:#ffd9a0;font-size:15px}
.cite{font-size:12px;word-break:break-all;color:#cbb6dc}
#ink path,#flows path,#pipes path{stroke:none !important}
#motionNote{margin-left:8px;color:#f3ead6;font-size:13px}
</style>
</head>

<section class="corr" id="corr"><h2>寸关尺分区视图 1/3 左侧</h2><p>分区视图 1/3 左侧。这是全图左侧三表，不是完整图。表仍在原坐标。中央九环和右侧三表在另外两份里。</p></section></div>
<script>
/* JingluoFlow — deterministic clock and path sampling.
 * Visuals are a pure function of time. No Math.random, no per-frame velocity.
 *
 * Ideas read from (not copied as libraries):
 * - bangtutorial/bang-motion SKILL.md law 2, commit c1aa65e (MIT)
 * - givemotion/givemotion src/runtime/runtime.js gm.seek, commit a2b02980 (MIT)
 * - heygen-com/hyperframes docs/packages/player.mdx seek + docs/concepts/compositions.mdx
 *   frame render, commit 6e0e03f5 (Apache-2.0). The player package is not bundled.
 * - greensock/gsap-skills skills/gsap-timeline/SKILL.md time/pause, commit aed9cfd (MIT).
 *   GSAP itself is not bundled.
 * - oil-oil/oil-motion SKILL.md scrub / references/runtime.md frame-scrub, commit 07e31f2 (MIT)
 * Pipe clipping follows this repo's B/24 template (mask or clip stays on the stroke).
 */
(function (root) {
  function wrap(t, cycle) {
    if (!cycle) return 0;
    const m = t % cycle;
    return m < 0 ? m + cycle : m;
  }

  function laps(speed, cycle, period) {
    if (!period) return 1;
    const k = Math.round((speed * cycle) / period);
    return Math.max(1, k);
  }

  function uOf(t, cycle, nLaps, offset) {
    const x = (nLaps || 1) * (wrap(t, cycle) / cycle) + (offset || 0);
    return wrap(x, 1);
  }

  /* mode: loop (closed), fade (open, one direction, invisible at the ends),
     ping (open, reverse at the ends — stays on the stroke). */
  function travel(u, mode) {
    const x = wrap(u, 1);
    if (mode === 'ping') {
      const tri = x < 0.5 ? x * 2 : 2 - 2 * x;
      return { s: tri, fade: 1, dir: x < 0.5 ? 1 : -1 };
    }
    let fade = 1;
    if (mode !== 'loop') {
      const e = 0.035;
      if (x < e) fade = x / e;
      else if (x > 1 - e) fade = (1 - x) / e;
    }
    return { s: x, fade: fade, dir: 1 };
  }

  function behind(s, dir, distPx, len, mode) {
    if (!len) return 0;
    let L = s * len - (dir || 1) * distPx;
    if (mode === 'loop') L = wrap(L, len);
    else L = Math.max(0, Math.min(len, L));
    return L / len;
  }

  function sample(pathEl, len, s, amp, spin) {
    if (!pathEl || !len) return { x: 0, y: 0, cx: 0, cy: 0, off: 0 };
    const u = Math.min(1, Math.max(0, s));
    const L = u * len;
    const dL = Math.max(0.8, Math.min(2.5, len * 0.004));
    const p = pathEl.getPointAtLength(Math.min(len, L));
    const p2 = pathEl.getPointAtLength(Math.min(len, L + dL));
    const p1 = pathEl.getPointAtLength(Math.max(0, L - dL));
    let tx = p2.x - p1.x;
    let ty = p2.y - p1.y;
    const mag = Math.hypot(tx, ty) || 1;
    const nx = -ty / mag;
    const ny = tx / mag;
    const off = (amp || 0) * Math.sin(spin || 0);
    return { x: p.x + nx * off, y: p.y + ny * off, cx: p.x, cy: p.y, off: off };
  }

  function twinkle(t, cycle, n, phi) {
    const ph = wrap(t, cycle) / cycle;
    return 0.5 + 0.5 * Math.sin(2 * Math.PI * ((n || 1) * ph + (phi || 0)));
  }

  /* After the flow passes index, the point keeps glowing, then fades in the
     slot before it is due again so t=0 matches t=cycle. Index 0 lights up at
     the wrap; that is the start of its slot, not a seam mismatch. */
  function glowAmp(t, index, slot, n) {
    slot = slot || 2;
    n = n || 12;
    const pos = wrap(t, slot * n) / slot;
    const since = wrap(pos - index, n);
    if (since < 1) return 1;
    if (since < 1.25) return 1 - 0.25 * ((since - 1) / 0.25);
    if (since < n - 1) return 0.75;
    return 0.75 * (1 - (since - (n - 1)));
  }

  function FlowClock(cycle) {
    this.cycle = cycle;
    this.t = 0;
    this.tb = 0;
    this.playing = true;
    this.speed = 1;
    this.bspeed = 1;
    this.last = null;
  }
  FlowClock.prototype.tick = function (ts) {
    if (this.last != null && this.playing) {
      const dt = (ts - this.last) / 1000;
      this.t += dt * this.speed;
      this.tb += dt * this.bspeed;
    }
    this.last = ts;
  };
  FlowClock.prototype.seek = function (sec) {
    const cur = wrap(this.t, this.cycle);
    const next = wrap(+sec, this.cycle);
    const d = next - cur;
    this.t += d;
    this.tb += d;
  };

  const api = {
    wrap: wrap,
    laps: laps,
    uOf: uOf,
    travel: travel,
    behind: behind,
    sample: sample,
    twinkle: twinkle,
    glowAmp: glowAmp,
    FlowClock: FlowClock,
  };
  if (typeof module === 'object' && module.exports) module.exports = api;
  root.JingluoFlow = api;
})(typeof window !== 'undefined' ? window : globalThis);

  const YANG='M0,-1 A1,1 0 0 1 0,1 A.5,.5 0 0 0 0,0 A.5,.5 0 0 1 0,-1 Z';
  TJ.order.forEach(k=>{const t=TJ.items[k]; const g=el('g',{'data-taiji':k},$('taiji'));
    el('circle',{cx:t.c[0],cy:t.c[1],r:t.r+1.4,fill:'#151515'},g);
    const rg=el('g',{},g);
    el('circle',{cx:t.c[0],cy:t.c[1],r:t.r,fill:t.dark},rg);
    const sg=el('g',{transform:`translate(${t.c[0]},${t.c[1]}) scale(${t.mirror*t.r},${t.r})`},rg);
    el('path',{d:YANG,fill:t.light},sg);
    el('circle',{cx:0,cy:0.5,r:0.13,fill:t.dark},sg);
    el('circle',{cx:0,cy:-0.5,r:0.13,fill:t.light},sg);
    t._rg=rg; t._g=g;
    const rim=el('circle',{cx:t.c[0],cy:t.c[1],r:t.r+2,'data-ring':1,'data-flow':'taiji-'+k,fill:'none',stroke:t.glow,'stroke-width':2.2,'stroke-dasharray':'8 10',pathLength:120},g);
    t._rim=rim;
    txt(t.label,{x:t.c[0]+(t.lx||0),y:t.c[1]+(t.ly||0),'font-size':t.fs||t.r*0.55,'font-weight':700,fill:'#111',stroke:'#fff','stroke-width':3,'paint-order':'stroke','data-label':'tj'+k},$('labels'));
  });
}
const cap=$('caption');
el('rect',{x:0,y:H,width:W,height:78,fill:'#4a2366'},cap);
el('rect',{x:0,y:H,width:W,height:2,fill:'#D4AF37'},cap);
const capMain=txt('',{x:16,y:H+24,'text-anchor':'start','font-size':16,'font-weight':700,fill:'#D4AF37'},cap);
const capSub=txt(CFG.assumption||'',{x:16,y:H+48,'text-anchor':'start','font-size':12,fill:'#ffd9a0'},cap);
txt(CFG.credit||'',{x:16,y:H+66,'text-anchor':'start','font-size':11,fill:'#cbb6dc'},cap);
const steps=CFG.steps||[{dur:CYC,main:'',sub:''}];
const starts=[];{let a=0;steps.forEach(s=>{starts.push(a);a+=s.dur;});}
function render(tm,tb){
  const t=JingluoFlow.wrap(tm,CYC);
  const tblack=JingluoFlow.wrap(tb,CYC);
  let si=0; for(let i=0;i<steps.length;i++) if(t>=starts[i]) si=i;
  capMain.textContent=steps[si].main||'';
  flows.forEach(o=>{
    const tt=o.it.group==='black'?tblack:t;
    o.dots.forEach((dot,i)=>{
      const u=JingluoFlow.uOf(tt,CYC,o.laps,i/o.dots.length);
      const tr=JingluoFlow.travel(u,o.mode);
      const q=JingluoFlow.sample(o.guide,o.len,tr.s,o.amp,2*Math.PI*(2*tr.s+i*0.2));
      dot.setAttribute('cx',q.x.toFixed(2)); dot.setAttribute('cy',q.y.toFixed(2));
      dot.setAttribute('data-dist',Math.hypot(q.x-q.cx,q.y-q.cy).toFixed(3));
      dot.setAttribute('opacity',(tr.fade*(0.55+0.45*Math.abs(Math.sin(i+tt)))).toFixed(3));
    });
    if(o.lead){
      const u=JingluoFlow.uOf(tt,CYC,o.laps,0);
      const tr=JingluoFlow.travel(u,o.mode);
      const q=JingluoFlow.sample(o.guide,o.len,tr.s,0,0);
      [o.lead.head,o.lead.core].forEach(e=>{e.setAttribute('cx',q.x.toFixed(2));e.setAttribute('cy',q.y.toFixed(2));e.setAttribute('opacity',tr.fade.toFixed(3));e.setAttribute('data-dist','0');});
      o.lead.tail.forEach((e,j)=>{
        const s2=JingluoFlow.behind(tr.s,tr.dir,(j+1)*7,o.len,o.mode);
        const q2=JingluoFlow.sample(o.guide,o.len,s2,0,0);
        e.setAttribute('cx',q2.x.toFixed(2)); e.setAttribute('cy',q2.y.toFixed(2));
        e.setAttribute('opacity',(tr.fade*0.65*(1-(j+1)/7)).toFixed(3));
        e.setAttribute('data-dist','0');
      });
    }
  });
  nodes.forEach(nd=>{
    const laps=Math.max(1,Math.round(nd.n.r/8));
    nd.rim.setAttribute('stroke-dashoffset',(-JingluoFlow.uOf(t,CYC,laps,0)*100).toFixed(2));
  });
  if(TJ){
    TJ.order.forEach(k=>{const tji=TJ.items[k];
      tji._rg.setAttribute('transform',`rotate(${(tji.rot+taijiAngle(k,t)).toFixed(2)} ${tji.c[0]} ${tji.c[1]})`);
      tji._rim.setAttribute('stroke-dashoffset',(-JingluoFlow.uOf(t,CYC,2,0)*120).toFixed(2));
    });
  }
}
window.renderAt=function(t,tb){if(tb===undefined)tb=t;render(t,tb);};
window.CYC=CYC;
window.coverage=function(){
  const flowsN=document.querySelectorAll('[data-flow]').length;
  const rings=document.querySelectorAll('[data-ring="1"], [data-rim]').length;
  const labelsN=document.querySelectorAll('[data-label]').length;
  let outside=0,n=0,moving=0;
  render(0,0);
  const a=[...document.querySelectorAll('.fx-crowd')].slice(0,8).map(c=>c.getAttribute('cx'));
  render(1,1);
  const b=[...document.querySelectorAll('.fx-crowd')].slice(0,8).map(c=>c.getAttribute('cx'));
  a.forEach((x,i)=>{if(x!==b[i]) moving++;});
  document.querySelectorAll('.fx-crowd,.fx-lead').forEach(c=>{
    n++; const d=+c.getAttribute('data-dist')||0; if(d>1.6) outside++;
  });
  const taijiN=TJ?TJ.order.length:0;
  return {flowsN,rings,labelsN,outside,n,moving,expected:(CFG.flows||[]).length+(CFG.nodes||[]).length+taijiN};
};
let Tm=0,Tb=0,playing=true,sm=1,sb=1,last=null,scale=1;
const video=/[?&]video=1/.test(location.search);
if(video) document.body.classList.add('video');
function applyScale(){ $('stage').style.width=Math.round(scale*100)+'%'; }
function loop(ts){if(last!=null&&playing){const dt=(ts-last)/1000;Tm+=dt*sm;Tb+=dt*sb;} last=ts; render(Tm,Tb); if($('scrub')) $('scrub').value=(JingluoFlow.wrap(Tm,CYC)/CYC).toFixed(3); requestAnimationFrame(loop);}
if(!video) requestAnimationFrame(loop); else render(0,0);
$('btnPlay').onclick=()=>{playing=!playing;$('btnPlay').textContent=playing?'⏸ 暂停':'▶ 播放';};
$('spMain').oninput=e=>{sm=+e.target.value;$('spMainV').textContent=sm.toFixed(1)+'×';};
$('spBlack').oninput=e=>{sb=+e.target.value;$('spBlackV').textContent=sb.toFixed(1)+'×';};
window.seek=function(sec){const nt=JingluoFlow.wrap(+sec,CYC);const cur=JingluoFlow.wrap(Tm,CYC);const d=nt-cur;Tm+=d;Tb+=d;render(Tm,Tb);$('scrub').value=(nt/CYC).toFixed(3);};
$('scrub').oninput=e=>window.seek(+e.target.value*CYC);
$('tgScan').onchange=e=>{
  if(scanPair){
    $('bg').style.display=e.target.checked?'none':'';
    $('raw').style.display=e.target.checked?'':'none';
    $('labels').style.display=e.target.checked?'none':($('tgText').checked?'':'none');
  } else $('bg').style.display=e.target.checked?'':'none';
};
$('tgFlow').onchange=e=>{ $('flows').style.display=e.target.checked?'':'none'; };
$('tgText').onchange=e=>{ $('labels').style.display=e.target.checked?'':'none'; };
$('tgQuiet').onchange=e=>document.body.classList.toggle('quiet',e.target.checked);
$('tgContrast').onchange=e=>document.body.classList.toggle('hc',e.target.checked);
$('zoomIn').onclick=()=>{scale=Math.min(3,scale+0.25);applyScale();};
$('zoomOut').onclick=()=>{scale=Math.max(0.6,scale-0.25);applyScale();};
$('zoomReset').onclick=()=>{scale=1;applyScale();};
const mq=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)');
if(mq&&mq.matches){document.body.classList.add('quiet');$('tgQuiet').checked=true;}
if(mq&&mq.matches){const n=$('motionNote'); if(n){n.hidden=false; $('tgQuiet').addEventListener('change',()=>{n.hidden=!$('tgQuiet').checked;});}}

let spinHeld=null;
function applySpin(){
  const scan=$('tgScan').checked;
  const textOn=$('tgText').checked;
  const flowOn=$('tgFlow').checked;
  $('spin').style.display=scan?'none':'';
  if($('geom')) $('geom').style.display=scan?'none':'';
  if($('kept')) $('kept').style.display=scan?'none':'';
  $('flows').style.display=(scan||!flowOn)?'none':'';
  $('nodes').style.display=scan?'none':'';
  $('nodesBack').style.display=scan?'none':'';
  $('pipes').style.display=scan?'none':'';
  $('ink').style.display=scan?'none':'';
  if($('taiji')) $('taiji').style.display=scan?'none':'';
  $('labels').style.display=(scan||!textOn)?'none':'';
  if(scan) return;
  let u=+$('scrub').value;
  if(document.body.classList.contains('quiet')){
    if(spinHeld==null) spinHeld=u;
    u=spinHeld;
  } else spinHeld=null;
  document.querySelectorAll('[data-spin]').forEach(el=>{
    const deg=u*(+el.getAttribute('data-turns'))*360;
    el.setAttribute('transform','rotate('+deg.toFixed(3)+' '+el.getAttribute('data-cx')+' '+el.getAttribute('data-cy')+')');
  });
}
const _seekSpin=window.seek;
window.seek=function(sec){_seekSpin(sec); if(document.body.classList.contains('quiet')) spinHeld=+$('scrub').value; applySpin();};
$('tgScan').addEventListener('change',()=>{spinHeld=null; applySpin();});
$('tgFlow').addEventListener('change',applySpin);
$('tgText').addEventListener('change',applySpin);
$('tgQuiet').addEventListener('change',()=>{spinHeld=null; applySpin();});
window.spinState=function(){return [...document.querySelectorAll('[data-spin]')].map(el=>({id:el.id,kind:el.getAttribute('data-kind'),turns:+el.getAttribute('data-turns'),transform:el.getAttribute('transform')||''}));};
(function spinLoop(){applySpin(); requestAnimationFrame(spinLoop);})();
</script>
