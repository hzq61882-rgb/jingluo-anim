const cap=$('caption');const cy=H;

// ---------- timeline ----------
const starts=[];{let a=0;CFG.steps.forEach(s=>{starts.push(a);a+=s.dur;});}
function ease(x){return x<0?0:x>1?1:x*x*(3-2*x);}
function pt(o,f){return o.dash.getPointAtLength(Math.max(0,Math.min(1,f))*o.len);}
function render(tm,tb){
  const t=((tm%CYC)+CYC)%CYC;const ph=t/CYC;const phb=(((tb%CYC)+CYC)%CYC)/CYC;
  let si=0;for(let i=0;i<nst;i++)if(t>=starts[i])si=i;
  const st=CFG.steps[si],lt=(t-starts[si])/st.dur;const on=new Set(st.on||[]);
  const prev=new Set((CFG.steps[(si-1+nst)%nst].on)||[]);
  capMain.textContent=st.main;capSub.textContent=st.sub||'';
  stepDots.forEach((d,i)=>{d.setAttribute('fill',i===si?'#ffe27a':'#cbb6dc');d.setAttribute('opacity',i===si?1:0.45);d.setAttribute('r',i===si?5:4);});
  items.forEach(o=>{const it=o.it;const P=it.group==='black'?phb:ph;const act=on.has(it.id);
    if(it.type==='pulse'){
      if(act){const pul=0.6+0.4*Math.sin(lt*Math.PI*6);o.ring.setAttribute('opacity',pul.toFixed(3));o.halo.setAttribute('opacity',(0.6*pul).toFixed(3));
        const w=(lt*3)%1;o.wave.setAttribute('r',(it.r+w*16).toFixed(2));o.wave.setAttribute('opacity',(1-w).toFixed(3));}
      else{const b=it.idle??0;o.ring.setAttribute('opacity',b);o.halo.setAttribute('opacity',0);o.wave.setAttribute('opacity',0);}
      return;}
    if(o.k&&o.P>1)o.dash.setAttribute('stroke-dashoffset',(-o.k*o.P*P).toFixed(2));
    if(o.dots)o.dots.forEach((d,i)=>{let f=(o.dk*P+i/o.n)%1;if(it.closed===undefined&&false)f=f;const q=pt(o,f);d.setAttribute('cx',q.x.toFixed(1));d.setAttribute('cy',q.y.toFixed(1));d.setAttribute('opacity',it.closed?1:Math.min(1,Math.sin(Math.PI*f)*2).toFixed(3));});
    if(o.chev)o.chev.forEach((c,i)=>{const f=(o.k*P+i/o.n)%1;const a=pt(o,f),b=pt(o,Math.min(1,f+1.5/o.len)),a0=pt(o,Math.max(0,f-1.5/o.len));
      const ang=Math.atan2(b.y-a0.y,b.x-a0.x)*180/Math.PI;c.setAttribute('transform',`translate(${a.x.toFixed(1)},${a.y.toFixed(1)}) rotate(${ang.toFixed(1)})`);c.setAttribute('opacity',Math.min(1,Math.sin(Math.PI*f)*2.5).toFixed(3));});
    // highlight for active step
    if(o.trail){
      if(act){const cs=it.cs??0,ce=it.ce??0.85;const p=it.closed?lt:ease((lt-cs)/(ce-cs));o.trail.setAttribute('stroke-dasharray',`${(p*o.len).toFixed(1)} ${o.len*2+10}`);o.trail.setAttribute('stroke-opacity',it.style==='band'?0.85:0.9);
        if(o.spark){const q=pt(o,p);[o.spark,o.core].forEach(s=>{s.setAttribute('cx',q.x);s.setAttribute('cy',q.y);s.setAttribute('opacity',lt>=cs?1:0);});}}
      else if(prev.has(it.id)){const fd=Math.max(0,1-lt*2.5);o.trail.setAttribute('stroke-dasharray',`${o.len+1} 0`);o.trail.setAttribute('stroke-opacity',(0.6*fd).toFixed(3));if(o.spark){o.spark.setAttribute('opacity',0);o.core.setAttribute('opacity',0);}}
      else{o.trail.setAttribute('stroke-opacity',0);if(o.spark){o.spark.setAttribute('opacity',0);o.core.setAttribute('opacity',0);}}
      if(it.style==='band')o.dash.setAttribute('stroke-opacity',act?1:(it.idleOp??0.75));
      if(it.style==='faint')o.dash.setAttribute('stroke-opacity',act?1:0.6);
      if(it.style==='gold'&&it.idleOp!==undefined)o.dash.setAttribute('stroke-opacity',act?0.95:it.idleOp);
    }
  });
}
