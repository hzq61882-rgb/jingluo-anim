.wrap{max-width:820px;margin:0 auto;padding:14px}
h1{font-size:20px;color:#D4AF37;margin:6px 0 4px;letter-spacing:2px;font-weight:700}
.sub{font-size:12px;color:#cbb6dc;margin-bottom:10px}
#stage{width:100%;height:auto;display:block;border:1px solid rgba(212,175,55,.45);border-radius:6px;background:#fff}
.ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:12px 0;font-size:14px}
button{font-family:inherit;background:#6B3A8C;color:#f3ead6;border:1px solid #D4AF37;border-radius:4px;padding:5px 12px;font-size:14px;cursor:pointer}
label{cursor:pointer;user-select:none}
input[type=checkbox]{accent-color:#D4AF37}
input[type=range]{accent-color:#D4AF37;width:140px}
.note{font-size:12px;color:#cbb6dc;line-height:1.75}
body.video .wrap{max-width:none;padding:0}
body.video h1,body.video .sub,body.video .ctl,body.video .note{display:none}
body.video #stage{border:0;border-radius:0;width:100vw}
</style>

function ease(x){return x<0?0:x>1?1:x*x*(3-2*x);}

const NS6=CH.order.length,SL=CYC/NS6;
function render(tm,tb,tw){
  renderBrand(tw===undefined?tm:tw);
  const t=((tm%CYC)+CYC)%CYC;const ph=t/CYC;const phb=(((tb%CYC)+CYC)%CYC)/CYC;
  let si=0;for(let i=0;i<nst;i++)if(t>=starts[i])si=i;
  const st=CFG.steps[si],lt=(t-starts[si])/st.dur;const on=new Set(st.on||[]);
  const prev=new Set((CFG.steps[(si-1+nst)%nst].on)||[]);

    if(o.trail){
