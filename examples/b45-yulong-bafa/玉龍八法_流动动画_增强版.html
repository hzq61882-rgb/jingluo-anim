  html,body{margin:0;background:#2a1338;color:#f3ead6;font-family:"NotoTC","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:14px}
  h1{font-size:20px;color:#D4AF37;margin:6px 0 4px;letter-spacing:2px}
  .sub{font-size:12px;color:#cbb6dc;margin-bottom:10px}
  #stage{width:100%;height:auto;display:block;border:1px solid rgba(212,175,55,.45);border-radius:6px;background:#fff}
  .ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:12px 0;font-size:14px}
  button,select{background:#6B3A8C;color:#f3ead6;border:1px solid #D4AF37;border-radius:4px;padding:5px 12px;font-size:14px;cursor:pointer}
  label{cursor:pointer;user-select:none}
  input[type=checkbox]{accent-color:#D4AF37}
  input[type=range]{accent-color:#D4AF37;width:140px}
  .note{font-size:12px;color:#cbb6dc;line-height:1.75}
  body.video .wrap{max-width:none;padding:0}
  body.video h1,body.video .sub,body.video .ctl,body.video .note{display:none}
  body.video #stage{border:0;border-radius:0;width:100vw}

@media (max-width:720px){
  .wrap{padding:8px}
  h1{font-size:17px;letter-spacing:0}
  .ctl{gap:8px 12px;font-size:15px}
  input[type=range]{width:min(100%,220px);max-width:100%}
  button,select{min-height:40px}
}
.ctl{max-width:100%}
.pipe-swarm{pointer-events:none}
body.quiet .fx-crowd{display:none}
body.quiet #L_flow{display:none}
body.hc{background:#120814;color:#fff}
body.hc .note,body.hc .sub{color:#f6efe2}
body.hc .ctl{background:#1a0b22;border:1px solid #D4AF37;border-radius:6px;padding:8px}
</style>
</head>
<body>
<div class="wrap">
<h1 id="h1"></h1>
<div class="sub" id="subt"></div>
<svg id="stage" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowU" filterUnits="userSpaceOnUse" x="-50" y="-50" width="4000" height="4000">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>

/* Attach pipe particles to an existing chart's flow items.
 * Uses JingluoFlow. Does not invent paths or change point order.
 * Closed strokes loop. Open strokes fade at the ends. ping is not applied here.
 */
(function () {
  const WX = { 木: '#3fdc5a', 火: '#ff3b30', 土: '#ffd60a', 金: '#ffffff', 水: '#2f80ff' };
  const STYLE = { gold: '#ffd34d', band: '#fff4cc', solid: '#e8fdff', dashed: '#ffd0ea', faint: '#e2ccff' };
  let swarms = [];
  let pulses = [];
  let meta = null;
  const grads = {};

  function defs() {
    return document.querySelector('#stage defs') || document.querySelector('svg defs');
  }
  function colorOf(it) {
    if (it.color && WX[it.color]) return WX[it.color];
    if (it.color) return it.color;
    return STYLE[it.style] || '#ffd34d';
  }
  function grad(color) {
    const key = String(color).replace('#', '');
    if (grads[key]) return 'url(#' + grads[key] + ')';
    const id = 'bkp_' + key;
    grads[key] = id;
    const rg = el('radialGradient', { id: id }, defs());
    el('stop', { offset: '0', 'stop-color': '#ffffff' }, rg);
    el('stop', { offset: '0.4', 'stop-color': color }, rg);
    el('stop', { offset: '1', 'stop-color': color, 'stop-opacity': '0' }, rg);
    return 'url(#' + id + ')';
  }
  function paint(node, color) {
    const light = !color || String(color).toLowerCase() === '#ffffff' || String(color).toLowerCase() === '#e8fdff';
    if (light) {
      node.setAttribute('fill', '#ffffff');
      node.setAttribute('stroke', '#140a1c');
      node.setAttribute('stroke-width', '0.4');
    } else node.setAttribute('fill', grad(color));
  }
  function hold(t, id) {
    const F = JingluoFlow;
    const tt = F.wrap(t, meta.cycle);
    const steps = meta.steps || [];
    const starts = meta.starts || [];
    let on = false;
    let until = meta.cycle;
    steps.forEach(function (s, i) {
      if (!s.on || s.on.indexOf(id) < 0) return;
      const a = starts[i];
      const b = a + s.dur;
      if (tt >= a && tt < b) on = true;
      let dt = a - tt;
      if (dt < 0) dt += meta.cycle;
      if (dt < until) until = dt;
    });
    if (on) return { on: true, amp: 1 };
    const fade = 1.2;
    const amp = until < fade ? 0.7 * (until / fade) : 0.7;
    return { on: false, amp: amp };
  }

  function install(items, opts) {
    meta = opts;
    swarms = [];
    pulses = [];
    items.forEach(function (o, idx) {
      const it = o.it;
      if (!it) return;
      if (it.type === 'pulse') {
        if (o.ring) pulses.push(o);
        return;
      }
      if (!o.dash) return;
      const d = o.dash.getAttribute('d');
      if (!d) return;
      const len0 = o.len || o.dash.getTotalLength() || 0;
      if (len0 < 8) return;
      const color = colorOf(it);
      const width = Math.max(5.2, (+it.width || 3) + 2.2);
      const pr = 1.15;
      const amp = Math.min(1.05, Math.max(0, width * 0.5 - pr - 0.4));
      const maskId = 'bmsk_' + (it.id || idx);
      const mask = el('mask', { id: maskId, maskUnits: 'userSpaceOnUse' }, defs());
      el('path', {
        d: d, fill: 'none', stroke: '#fff', 'stroke-width': width,
        'stroke-linecap': 'round', 'stroke-linejoin': 'round'
      }, mask);
      const parent = o.g || o.dash.parentNode;
      const g = el('g', { mask: 'url(#' + maskId + ')', class: 'pipe-swarm', 'data-pipe': it.id || ('p' + idx), 'pointer-events': 'none' }, parent);
      const path = el('path', { d: d, fill: 'none', stroke: 'none' }, g);
      const len = path.getTotalLength() || 1;
      const n = Math.max(6, Math.min(28, Math.round(len / 22)));
      const dots = [];
      for (let i = 0; i < n; i++) {
        const c = el('circle', { r: pr, class: 'fx-crowd' }, g);
        paint(c, color);
        dots.push(c);
      }
      let lead = null;
      if (len >= 48) {
        const tail = [];
        for (let j = 0; j < 6; j++) {
          const e = el('circle', { r: (2.1 * (1 - j / 8)).toFixed(2), class: 'fx-lead' }, g);
          paint(e, color);
          tail.push(e);
        }
        const head = el('circle', { r: 3.4, class: 'fx-lead' }, g);
        paint(head, color);
        const core = el('circle', { r: 1.3, fill: '#ffffff', stroke: color, 'stroke-width': 0.55, class: 'fx-lead' }, g);

    if (note && note.textContent.indexOf('不是疗效') < 0) {
      note.insertAdjacentHTML('beforeend', '<br>增强：同色粒子和白芯领头只沿原来的折线走。闭合的环循环，开口的线在两端淡出，不另画穿越空白的线，也不把无箭头的线改成往返。有箭头的仍按原来的点序。这是图示，不是疗效。');
    }

  function put(node, x, y, op) {
    node.setAttribute('cx', x.toFixed(2));
    node.setAttribute('cy', y.toFixed(2));
    node.setAttribute('opacity', Math.max(0, Math.min(1, op)).toFixed(3));
  }

  function draw(t, tb) {
    if (!meta) return;
    const F = JingluoFlow;
    swarms.forEach(function (s) {
      const tt = s.clock === 'black' ? tb : t;
      s.dots.forEach(function (dot, i) {
        const u = F.uOf(tt, meta.cycle, s.laps, i / s.dots.length);
        const tr = F.travel(u, s.mode);
        const spin = 2 * Math.PI * (3 * tr.s + i * 0.17);
        const q = F.sample(s.path, s.len, tr.s, s.amp, spin);
        dot.setAttribute('data-dist', Math.hypot(q.x - q.cx, q.y - q.cy).toFixed(3));

      put(s.lead.head, q.x, q.y, tr.fade * 0.95);
      put(s.lead.core, q.x, q.y, tr.fade);

      s.lead.core.setAttribute('data-dist', '0');

      const g = hold(t, o.it.id);
      if (g.on) return;

    });
  }

  function audit() {
    let n = 0, outside = 0, maxDist = 0, visible = 0;
    swarms.forEach(function (s) {
      const lim = s.amp + 0.25;
      s.dots.forEach(function (d) {
        n++;
        const dist = +d.getAttribute('data-dist') || 0;
        const op = +d.getAttribute('opacity') || 0;
        if (dist > lim) outside++;
        if (dist > maxDist) maxDist = dist;
        if (op > 0.3) visible++;
      });
      if (s.lead) {
        [s.lead.head, s.lead.core].concat(s.lead.tail).forEach(function (d) {
          n++;
          const dist = +d.getAttribute('data-dist') || 0;
          if (dist > 0.25) outside++;
          if ((+d.getAttribute('opacity') || 0) > 0.3) visible++;
        });
      }
    });

  }

})();

window.renderAt=function(t,tb){if(tb===undefined)tb=t;render(t,tb);if(window.JingluoBake)JingluoBake.draw(JingluoFlow.wrap(t,CYC),JingluoFlow.wrap(tb,CYC));};
window.CYC=CYC;
JingluoBake.install(items,{cycle:CYC,steps:CFG.steps,starts:starts});

// ---------- controls ----------
let Tm=0,Tb=0,playing=true,sm=1,sb=1,last=null;
const video=/[?&]video=1/.test(location.search);
if(video)document.body.classList.add('video');
function loop(ts){if(last!==null&&playing){const dt=(ts-last)/1000;Tm+=dt*sm;Tb+=dt*sb;}last=ts;window.renderAt(Tm,Tb);$('scrub').value=((Tm%CYC+CYC)%CYC/CYC).toFixed(3);requestAnimationFrame(loop);}
if(!video)requestAnimationFrame(loop);else render(0,0);
$('btnPlay').onclick=()=>{playing=!playing;$('btnPlay').textContent=playing?'⏸ 暂停':'▶ 播放';};
$('spMain').oninput=e=>{sm=+e.target.value;$('spMainV').textContent=sm.toFixed(1)+'×';};
$('spBlack').oninput=e=>{sb=+e.target.value;$('spBlackV').textContent=sb.toFixed(1)+'×';};
$('scrub').oninput=e=>{window.seek(+e.target.value*CYC);};

window.seek=function(sec){
  const nt=JingluoFlow.wrap(+sec,CYC);
  const cur=JingluoFlow.wrap(Tm,CYC);
  const d=nt-cur;Tm+=d;
  if(typeof Tb!=='undefined')Tb+=d;
  window.renderAt(Tm,typeof Tb==='undefined'?Tm:Tb);
  if($('scrub'))$('scrub').value=(JingluoFlow.wrap(Tm,CYC)/CYC).toFixed(3);
};
if($('tgQuiet'))$('tgQuiet').onchange=e=>document.body.classList.toggle('quiet',e.target.checked);
if($('tgContrast'))$('tgContrast').onchange=e=>document.body.classList.toggle('hc',e.target.checked);
{const mq=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)');
 if(mq&&mq.matches&&$('tgQuiet')){document.body.classList.add('quiet');$('tgQuiet').checked=true;}}
</script>
